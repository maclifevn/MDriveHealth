name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: sonoma-arm64
            runner: macos-14
            developer: /Applications/Xcode_16.2.app/Contents/Developer
            package: ""
          - profile: sequoia-arm64
            runner: macos-15
            developer: /Applications/Xcode_16.4.app/Contents/Developer
            package: ""
          - profile: sequoia-intel
            runner: macos-15-intel
            developer: /Applications/Xcode_16.4.app/Contents/Developer
            package: ""
          - profile: latest-arm64
            runner: xcode-27
            developer: /Applications/Xcode_27.app/Contents/Developer
            package: --package
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
      CI_PROFILE: ${{ matrix.profile }}
      PACKAGE_FLAG: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install checksum-pinned XcodeGen
        run: |
          python3 scripts/install_ci_tools.py "$RUNNER_TEMP/mdrivehealth-tools"
          echo "$RUNNER_TEMP/mdrivehealth-tools/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Core, app, sanitizer, analyzer and stress contracts
        run: |
          args=()
          if [[ -n "$PACKAGE_FLAG" ]]; then args+=("$PACKAGE_FLAG"); fi
          python3 scripts/ci.py "$CI_PROFILE" "$RUNNER_TEMP/mdrivehealth-ci" "${args[@]}"
      - name: Keep logs, test results and unsigned artifact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MDriveHealth-${{ matrix.profile }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mdrivehealth-tools/tool-manifest.json
            ${{ runner.temp }}/mdrivehealth-ci/*.log
            ${{ runner.temp }}/mdrivehealth-ci/*.json
            ${{ runner.temp }}/mdrivehealth-ci/*.plist
            ${{ runner.temp }}/mdrivehealth-ci/*.xcresult
            ${{ runner.temp }}/mdrivehealth-ci/release/*.log
            ${{ runner.temp }}/mdrivehealth-ci/release/*.json
            ${{ runner.temp }}/mdrivehealth-ci/release/*.xcresult
            ${{ runner.temp }}/mdrivehealth-ci/release/*.dmg
            ${{ runner.temp }}/mdrivehealth-ci/release/*-source.zip
            ${{ runner.temp }}/mdrivehealth-ci/release/SHA256SUMS

  production-contracts:
    name: production-contracts
    needs: contracts
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every matrix job
        env:
          MATRIX_RESULT: ${{ needs.contracts.result }}
        run: test "$MATRIX_RESULT" = success
